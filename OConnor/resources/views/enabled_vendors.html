<html>
<head>
    <script type="text/javascript" nonce="<%=scriptNonce%>">
        Ext4.onReady(function () {
            var pageButtons = [{ text: 'Add New Vendor', handler: addVendor }];
            createGrid(dbSchemaName, 'vendors', 'dashboard_vendors', '', 'a', 'b', pageButtons);

            function addVendor() {
                //construct form
                var theForm = new Ext4.FormPanel({
                    xtype: 'form',
                    width: 300,
                    bodyStyle: 'background-color:#fff;padding: 10px',
                    border: false,
                    labelWidth: 130,
                    items: [{
                        xtype: 'textfield',
                        name: 'vendor',
                        fieldLabel: 'Vendor',
                        allowBlank: false
                    }, {
                        xtype: 'checkbox',
                        name: 'shopUW',
                        fieldLabel: 'Shop UW'
                    }, {
                        xtype: 'textfield',
                        name: 'phone',
                        fieldLabel: 'Phone Number'
                    }, {
                        xtype: 'textfield',
                        name: 'email',
                        fieldLabel: 'Email Address'
                    }, {
                        xtype: 'textfield',
                        name: 'url',
                        fieldLabel: 'URL'
                    }, {
                        xtype: 'textfield',
                        name: 'address',
                        fieldLabel: 'Mailing Address'
                    }, {
                        xtype: 'textfield',
                        name: 'city',
                        fieldLabel: 'City'
                    }, {
                        xtype: 'textfield',
                        name: 'state',
                        fieldLabel: 'State'
                    }, {
                        xtype: 'textfield',
                        name: 'zip',
                        fieldLabel: 'Zip code'
                    }, {
                        xtype: 'textfield',
                        name: 'po',
                        fieldLabel: 'Purchase Order Number'
                    }, {
                        xtype: 'textfield',
                        name: 'comments',
                        fieldLabel: 'Comments'
                    }, {
                        xtype: 'textfield',
                        name: 'account_number',
                        fieldLabel: 'Account Number'
                    }, {
                        xtype: 'checkbox',
                        name: 'enabled',
                        fieldLabel: 'Enabled',
                        checked: 'true',
                        uncheckedValue: 'false'
                    }]
                });

                var theWindow = new Ext4.Window({
                    title: 'Add new vendor',
                    width: 320,
                    bodyStyle: 'background-color:#fff',
                    autoHeight: true,
                    items: theForm,
                    buttonAlign: 'center',
                    buttons: [{
                        text: 'Submit',
                        formBind: true,
                        scope: this,
                        handler: function () {
                            theWindow.hide();

                            //insert record into labkey
                            LABKEY.Query.insertRows({
                                schemaName: dbSchemaName,
                                queryName: 'vendors',
                                successCallback: function (d) {
                                    onSuccess(d);
                                },
                                rowDataArray: [theForm.getValues()]
                            });
                        }
                    },
                        {
                            text: 'Cancel',
                            scope: this,
                            handler: function () {
                                theWindow.hide();
                            }
                        }]
                });

                theWindow.show();
            };

        });
    </script>
</head>

<body>
    <div id="a"></div>
</body>
</html>
